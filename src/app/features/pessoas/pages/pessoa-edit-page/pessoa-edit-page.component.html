<h1 class="text-2xl font-bold">Editar pessoa</h1>

@if (store.error(); as error) {
  <p role="alert" class="mt-4 rounded-[10px] border border-red-700 bg-white p-3 text-red-700">
    {{ error }}
  </p>
}

@if (pessoa(); as pessoa) {
  <div class="mt-5 max-w-xl rounded-[10px] bg-white p-5 shadow-sm">
    <app-pessoa-form [initial]="pessoa" submitLabel="Atualizar" (saved)="save($event)" />
  </div>
} @else {
  <p class="mt-5">Pessoa não encontrada.</p>
  <a
    routerLink="/pessoas/listas"
    class="mt-3 inline-flex min-h-11 items-center rounded-[10px] bg-primary px-5 font-medium text-white no-underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary"
  >
    Voltar para a lista
  </a>
}
